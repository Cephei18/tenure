# MANUAL ONLY: builds the Tenure Lab frontend (frontend/) for a GitHub Pages project site under /tenure/.
# The frontend is hosted on Vercel; this workflow is kept as a fallback and runs only when started by hand
# (Actions -> pages -> Run workflow), so pushes never produce a failing run while Pages is not configured.
# Requires Settings -> Pages -> Source: "GitHub Actions". Tests and build on every push: frontend-ci.yml.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test # TS math vs test/vectors (exact), losses.csv replay vs the hook, timeline vs docs
      - run: npm run build
        env:
          GITHUB_PAGES: "true" # base path /tenure/ (vite.config.ts)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
