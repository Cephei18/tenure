# Builds the Tenure Lab frontend (frontend/) and publishes it to GitHub Pages: https://cephei18.github.io/tenure/
# No secrets: the site is static and read-only (public RPC, committed data). One-time repo setting:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/results/**"
      - "docs/INCIDENT_REACTIVE.md"
      - "docs/RESULTS.md"
      - "deployments/**"
      - "test/vectors/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test # TS math vs test/vectors (exact), losses.csv replay vs the hook, timeline vs docs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
