[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read-write", path = "./docs/results"}, {access = "read", path = "./test/vectors"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = false
optimizer = true
optimizer_runs = 200

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[fuzz]
runs = 256
seed = "0x7e2a"

# Size-safe build for anvil/testnet deploys (TenureHook > 24KB without IR). Run the suite under it at milestones:
#   FOUNDRY_PROFILE=deploy forge test
[profile.deploy]
via_ir = true
# TenureHook is 24,460 B here (EIP-170 limit 24,576 B). If it grows past the limit, lower optimizer_runs
# (measured: 200 -> 100 saves ~430 B, 100 -> 30 only ~70 B more) or move code out of the hook. Do not ship over
# the limit.
